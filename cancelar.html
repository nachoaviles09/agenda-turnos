<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancelar Turno | Arena Paraná Sport</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #060608;
      color: #fff;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      justify-content: center;
    }
    .cancel-box {
      background: rgba(22, 22, 28, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }
    h2 {
      margin: 0 0 10px 0;
      color: #ff3b30;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
    }
    p.desc {
      color: #a0a0ab;
      font-size: 0.9rem;
      margin-bottom: 25px;
      line-height: 1.4;
    }
    .input-group {
      text-align: left;
      margin-bottom: 16px;
    }
    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: #a0a0ab;
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 10px;
      outline: none;
    }
    input:focus {
      border-color: #ff3b30;
    }
    #code-input {
      text-transform: uppercase;
      font-weight: 700;
      text-align: center;
      letter-spacing: 2px;
    }
    button {
      width: 100%;
      padding: 16px;
      font-size: 1rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      background: #ff3b30;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #result-msg {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      font-weight: 600;
      display: none;
      line-height: 1.4;
      font-size: 0.9rem;
    }
    .status-ok { background: rgba(37, 211, 102, 0.18); border: 1px solid #25d366; color: #25d366; }
    .status-error { background: rgba(255, 59, 48, 0.18); border: 1px solid #ff3b30; color: #ff3b30; }
    
    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: #a0a0ab;
      text-decoration: underline;
      font-size: 0.9rem;
    }
    .back-link:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="cancel-box">
    <h2>CANCELAR RESERVA</h2>
    <p class="desc">¿No podés asistir? Ingresá el código de tu turno para liberar la cancha.</p>

    <div class="input-group">
      <label for="code-input">Código del Turno</label>
      <input type="text" id="code-input" placeholder="Ej: 4821" autocomplete="off">
    </div>

    <button onclick="procesarCancelacion()" id="btn-cancelar">LIBERAR TURNO</button>

    <div id="result-msg"></div>
    
    <a href="index.html" class="back-link">Volver a la página principal</a>
  </div>

  <script>
    // IMPORTANTE: Pegá acá tu URL exacta de Google Apps Script
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLsWbd-41slJBYV8GyIvJyOI-VgLHJMY3Iutbdw3Jil3hOEyR1k7rFigZ3sBsGQYM/exec';

    // Permitir apretar Enter para cancelar
    document.getElementById('code-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        procesarCancelacion();
      }
    });

    async function procesarCancelacion() {
      const codeInput = document.getElementById('code-input').value.trim();
      const resultBox = document.getElementById('result-msg');
      const btn = document.getElementById('btn-cancelar');

      if (!codeInput) {
        alert("Por favor, ingresá el código de tu turno.");
        return;
      }

      btn.textContent = 'PROCESANDO...';
      btn.disabled = true;
      resultBox.style.display = 'none';

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'cancelar', code: codeInput })
        });

        const result = await response.json();

        resultBox.style.display = 'block';
        resultBox.className = '';

        if (result.status === 'ok') {
          resultBox.classList.add('status-ok');
          resultBox.innerHTML = `${result.message}<br><span style="font-size:0.85rem; color:#fff;">${result.details}</span>`;
          document.getElementById('code-input').value = '';
          btn.style.display = 'none'; // Ocultamos el botón tras el éxito
        } else {
          resultBox.classList.add('status-error');
          resultBox.innerHTML = result.message;
        }
      } catch (error) {
        resultBox.style.display = 'block';
        resultBox.classList.add('status-error');
        resultBox.innerHTML = 'Error de conexión. Reintente en unos minutos.';
      } finally {
        if(btn.style.display !== 'none') {
            btn.textContent = 'LIBERAR TURNO';
            btn.disabled = false;
        }
      }
    }
  </script>
</body>
</html>
